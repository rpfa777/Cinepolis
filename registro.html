<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cinépolis - Registro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #0b2545;
            color: white;
            padding: 15px;
            text-align: center;
        }

        header h1 {
            color: #ffc807; 
            margin: 0 0 10px 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: #ffc807;
        }

        main {
            padding: 20px;
            max-width: 400px;
            margin: 20px auto;
            background-color: white;
            border: 1px solid #ccc;
        }

        .campo {
            margin-bottom: 15px;
        }

        .campo label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .campo input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            background-color: #0b2545;
            color: #ffc807;
            border: none;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
        }

        button:hover {
            background-color: #081b33;
        }

        footer {
            background-color: #0b2545;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>CINÉPOLIS</h1>
        <nav>
            <a href="index.html">Inicio</a> | 
            <a href="registro.html">Registro</a> | 
            <a href="club.html">Club Cinépolis</a>
        </nav>
    </header>

    <main>
        <h2>Registro de Usuario</h2>
        <p>Completa tus datos para crear tu cuenta:</p>

        <form action="#" method="get">
            
            <div class="campo">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
            </div>

            <div class="campo">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="campo">
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" placeholder="10 dígitos" required>
            </div>

            <div class="campo">
                <label for="nacimiento">Fecha de Nacimiento:</label>
                <input type="date" id="nacimiento" name="nacimiento" required>
            </div>

            <div class="campo">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Crea una contraseña" required>
            </div>

            <button type="submit">Registrarme</button>

        </form>
    </main>

    <footer>
        <p>Ramos Flores Pedro Alexis <br>5-i<br>0643</p>
    </footer>

</body>
</html>
